[package]
name = "outlayer-tipbot"
version = "0.1.0"
edition = "2021"

[workspace]
exclude = ["contract"]

[dependencies]
tokio = { version = "1", features = ["full"] }
teloxide = { version = "0.13", features = ["macros"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
bs58 = "0.5"
sha2 = "0.10"
base64 = "0.22"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
urlencoding = "2"
